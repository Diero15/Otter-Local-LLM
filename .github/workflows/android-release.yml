name: Build & Publish Otter Local LLM Release (Beta)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Production Release APK (No Debug)
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Release Keystore (Fallback if secrets not set)
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass otterrelease123 \
              -keypass otterrelease123 \
              -dname "CN=diero777, OU=OtterLocalLLM, O=diero777, L=Global, S=Global, C=US"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=otterrelease123" >> $GITHUB_ENV
            echo "KEY_PASSWORD=otterrelease123" >> $GITHUB_ENV
          fi

      - name: Build Signed Release APK and AAB (Non-Debug)
        run: |
          gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Copy Release APK into release/ folder
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Otter-Local-LLM-v1.0.0-beta.1-release.apk
          cp app/build/outputs/apk/release/app-release.apk Otter-Local-LLM-v1.0.0-beta.1-release.apk
          cp app/build/outputs/bundle/release/app-release.aab Otter-Local-LLM-v1.0.0-beta.1-release.aab
          ls -lh release/Otter-Local-LLM-v1.0.0-beta.1-release.apk

      - name: Commit Release APK to release/ folder in GitHub repo
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f release/Otter-Local-LLM-v1.0.0-beta.1-release.apk
          git diff --staged --quiet || git commit -m "chore(release): add signed Otter-Local-LLM-v1.0.0-beta.1-release.apk [skip ci]"
          git push

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Otter-Local-LLM-Release-APK
          path: Otter-Local-LLM-v1.0.0-beta.1-release.apk

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Otter-Local-LLM-Release-AAB
          path: Otter-Local-LLM-v1.0.0-beta.1-release.aab

      - name: Publish APK directly to GitHub Releases (v1.0.0-beta.1)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-beta.1
          name: "🦦 Otter Local LLM v1.0.0-beta.1 (Beta Test - Release APK)"
          body_path: RELEASE_NOTES_BETA.md
          prerelease: true
          files: |
            Otter-Local-LLM-v1.0.0-beta.1-release.apk
            Otter-Local-LLM-v1.0.0-beta.1-release.aab
