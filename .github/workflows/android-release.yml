name: Build & Publish Otter Local LLM Release (Beta)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre del Tag o Versión (ej. v1.0.1-beta o v1.0.1)'
        required: false
        default: 'v1.0.1-beta'
  push:
    branches:
      - main
      - master
    tags:
      - '**'
  release:
    types: [published, created, prereleased]

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Production Release APK (No Debug)
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: determine_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.1-beta"
          fi
          # Limpiar espacios accidentales (ej: "v 1.0.1" -> "v1.0.1")
          CLEAN_TAG=$(echo "$TAG" | tr -d ' ')
          if [ -z "$CLEAN_TAG" ]; then
            CLEAN_TAG="v1.0.1-beta"
          fi
          echo "RELEASE_TAG=$CLEAN_TAG" >> $GITHUB_ENV
          echo "Detected Release Tag: $CLEAN_TAG"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Release Keystore (Fallback if secrets not set)
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass otterrelease123 \
              -keypass otterrelease123 \
              -dname "CN=diero777, OU=OtterLocalLLM, O=diero777, L=Global, S=Global, C=US"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=otterrelease123" >> $GITHUB_ENV
            echo "KEY_PASSWORD=otterrelease123" >> $GITHUB_ENV
          fi

      - name: Build Signed Release APK and AAB (Non-Debug)
        run: |
          gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release
          TAG="${{ env.RELEASE_TAG }}"
          APK_NAME="Otter-Local-LLM-${TAG}-release.apk"
          AAB_NAME="Otter-Local-LLM-${TAG}-release.aab"
          
          # Copiar con el tag específico
          cp app/build/outputs/apk/release/app-release.apk "release/${APK_NAME}"
          cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          cp app/build/outputs/bundle/release/app-release.aab "${AAB_NAME}"
          
          # Copiar también con nombre genérico para descarga directa
          cp app/build/outputs/apk/release/app-release.apk "release/Otter-Local-LLM-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "Otter-Local-LLM-release.apk"
          
          echo "APK_FILE=${APK_NAME}" >> $GITHUB_ENV
          echo "AAB_FILE=${AAB_NAME}" >> $GITHUB_ENV
          ls -lh release/

      - name: Commit Release APK to release/ folder in GitHub repo (Only on main/master)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f release/
          git diff --staged --quiet || git commit -m "chore(release): update release APK for ${{ env.RELEASE_TAG }} [skip ci]"
          git push || true

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Otter-Local-LLM-Release-APK
          path: ${{ env.APK_FILE }}

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Otter-Local-LLM-Release-AAB
          path: ${{ env.AAB_FILE }}

      - name: Publish APK directly to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "🦦 Otter Local LLM ${{ env.RELEASE_TAG }} (Beta Test - Release APK)"
          body_path: RELEASE_NOTES_BETA.md
          prerelease: true
          files: |
            ${{ env.APK_FILE }}
            ${{ env.AAB_FILE }}
            Otter-Local-LLM-release.apk
