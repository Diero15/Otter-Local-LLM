name: Build & Publish Otter Local LLM Release (Beta)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Production Release APK & AAB (No Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Release Keystore (Fallback if secrets not set)
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass otterrelease123 \
              -keypass otterrelease123 \
              -dname "CN=diero777, OU=OtterLocalLLM, O=diero777, L=Global, S=Global, C=US"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=otterrelease123" >> $GITHUB_ENV
            echo "KEY_PASSWORD=otterrelease123" >> $GITHUB_ENV
          fi

      - name: Build Release APK and AAB (Non-Debug)
        run: |
          gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Rename Release Artifacts
        run: |
          cp app/build/outputs/apk/release/app-release.apk Otter-Local-LLM-v1.0.0-beta.1-release.apk
          cp app/build/outputs/bundle/release/app-release.aab Otter-Local-LLM-v1.0.0-beta.1-release.aab

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Otter-Local-LLM-Release-APK
          path: Otter-Local-LLM-v1.0.0-beta.1-release.apk

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Otter-Local-LLM-Release-AAB
          path: Otter-Local-LLM-v1.0.0-beta.1-release.aab

      - name: Publish GitHub Pre-Release (Beta) on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "🦦 Otter Local LLM ${{ github.ref_name }} (Beta - Release Build)"
          body_path: RELEASE_NOTES_BETA.md
          prerelease: true
          files: |
            Otter-Local-LLM-v1.0.0-beta.1-release.apk
            Otter-Local-LLM-v1.0.0-beta.1-release.aab
