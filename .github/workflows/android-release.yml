name: Build & Publish Otter Local LLM Release (Beta)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre del Tag o Versión para la Release (ej. v1.0.1-beta o v1.0.1)'
        required: false
        default: 'v1.0.1-beta'
  push:
    branches:
      - main
      - master
    tags:
      - '**'
  release:
    types: [published, created, prereleased]

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Production Release APK (No Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: determine_tag
        run: |
          RAW_TAG="${{ github.event.release.tag_name || github.event.inputs.tag_name || github.ref_name || 'v1.0.1-beta' }}"
          CLEAN_TAG=$(echo "$RAW_TAG" | tr -d ' ' | tr -d '\r' | tr -d '\n')
          if [ -z "$CLEAN_TAG" ] || [ "$CLEAN_TAG" = "main" ] || [ "$CLEAN_TAG" = "master" ]; then
            CLEAN_TAG="v1.0.1-beta"
          fi
          echo "RELEASE_TAG=$CLEAN_TAG" >> $GITHUB_ENV
          echo "RAW_TAG=$RAW_TAG" >> $GITHUB_ENV
          echo "==> Using Release Tag: $CLEAN_TAG (Raw: $RAW_TAG)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Ensure Android SDK environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Prepare Release Signing Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass otterrelease123 \
              -keypass otterrelease123 \
              -dname "CN=diero777, OU=OtterLocalLLM, O=diero777, L=Global, S=Global, C=US"
            echo "STORE_PASSWORD=otterrelease123" >> $GITHUB_ENV
            echo "KEY_PASSWORD=otterrelease123" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV

      - name: Build Release APK and AAB with Gradle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ env.STORE_PASSWORD || secrets.STORE_PASSWORD || 'otterrelease123' }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD || secrets.KEY_PASSWORD || 'otterrelease123' }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Organize Release Binaries
        run: |
          mkdir -p release
          TAG="${{ env.RELEASE_TAG }}"
          
          # Copiar con nombre versionado exacto
          cp app/build/outputs/apk/release/app-release.apk "release/Otter-Local-LLM-${TAG}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "${TAG}-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release/Otter-Local-LLM-${TAG}-release.aab"
          
          # Copiar con nombres estándar adicionales
          cp app/build/outputs/apk/release/app-release.apk "release/Otter-Local-LLM-v1.0.1-beta-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "Otter-Local-LLM-release.apk"
          
          echo "Listado de binarios en release/:"
          ls -lh release/

      - name: Upload Release APK as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Otter-Local-LLM-${{ env.RELEASE_TAG }}-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Release AAB as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Otter-Local-LLM-${{ env.RELEASE_TAG }}-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: Attach APK and AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.release.tag_name || env.RELEASE_TAG }}
          name: "🦦 Otter Local LLM ${{ env.RELEASE_TAG }} (Release APK)"
          body_path: RELEASE_NOTES_BETA.md
          prerelease: true
          draft: false
          files: |
            release/*.apk
            release/*.aab
            Otter-Local-LLM-release.apk
